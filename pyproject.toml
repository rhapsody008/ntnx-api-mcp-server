[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntnx-api-mcp-server"
version = "0.8"
description = "Nutanix V4 API MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nutanix" }]
dependencies = [
    # 1.8.0 is the first release with StreamableHTTPSessionManager.
    "mcp>=1.8.0,<2.0.0",
    # Imported directly by the HTTP transport (also transitive deps of mcp).
    "anyio>=4.5",
    "starlette>=0.27",
    "uvicorn>=0.23.1",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.scripts]
nutanix-mcp = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
