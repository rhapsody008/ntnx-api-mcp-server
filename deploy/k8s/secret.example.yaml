# Copy to secret.yaml (gitignored), fill in, then:
#   kubectl apply -f deploy/k8s/secret.yaml
# Set EITHER PC_API_KEY OR PC_USERNAME/PC_PASSWORD, not both.
# Generate MCP_AUTH_TOKEN with:  openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: nutanix-mcp-secrets
  namespace: nutanix-mcp
type: Opaque
stringData:
  PC_API_KEY: "<prism-central-api-key>"
  # PC_USERNAME: "<username>"
  # PC_PASSWORD: "<password>"
  MCP_AUTH_TOKEN: "<random-32+-byte-token>"
